<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A fishing adventure for toddlers: tap the water, catch funny fish and sail from the lily pond to the night sea.">
<meta name="theme-color" content="#35a2ea">
<title>Funny Fish</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: the whole screen is the sea (one canvas). A bucket and three grown-up buttons float at
   the top, and a caption at the bottom shows whatever is being said. Single bright theme by
   choice, like Pizza Party. */
:root {
  --ink: #1d2b4f;
  --card: #ffffff;
  --sun: #ffd23f;
  --font-display: "Baloo 2", "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
  --slot: 40px;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
body {
  background: #35a2ea;
  color: var(--ink);
  font-family: var(--font-display);
  overflow: hidden;
  overscroll-behavior: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
[hidden] { display: none !important; }

#sea { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; outline: none; }

.hud {
  position: fixed; top: 0; left: 0; right: 0; z-index: 6;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
  pointer-events: none;
}
.hud > * { pointer-events: auto; }
.bucket {
  display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 6px;
  background: rgba(255,255,255,.88); border-radius: 999px; box-shadow: 0 3px 0 rgba(29,43,79,.18);
}
.slots { display: flex; gap: inherit; margin: 0; padding: 0; list-style: none; }
.bucket .pail { width: var(--slot); height: var(--slot); flex-shrink: 0; }
.bucket li { width: var(--slot); height: var(--slot); border-radius: 50%; border: 3px dashed rgba(29,43,79,.28); box-sizing: border-box; display: grid; place-items: center; overflow: hidden; }
.bucket li.full { border: 3px solid var(--ink); background: #e6f6ff; animation: pop .45s cubic-bezier(.3,1.6,.5,1); }
.bucket li canvas { display: block; }
.slots.party li { animation: hop .4s ease-in-out infinite alternate; }
.slots.party li:nth-child(2) { animation-delay: -.1s } .slots.party li:nth-child(3) { animation-delay: -.2s }
.slots.party li:nth-child(4) { animation-delay: -.3s } .slots.party li:nth-child(5) { animation-delay: -.4s }
.btns { display: flex; gap: 8px; }
.icon-btn { width: 48px; height: 48px; flex-shrink: 0; border: 0; padding: 0; border-radius: 50%; background: rgba(255,255,255,.88); box-shadow: 0 3px 0 rgba(29,43,79,.18); display: grid; place-items: center; }
.icon-btn svg { width: 26px; height: 26px; }

.caption {
  position: fixed; z-index: 2; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); transform: translateX(-50%);
  margin: 0; width: max-content; max-width: calc(100% - 32px); box-sizing: border-box;
  background: rgba(255,255,255,.94); border-radius: 999px; padding: 4px 20px;
  font-weight: 800; font-size: clamp(1.05rem, 2.6vw, 1.45rem); line-height: 1.25; text-align: center; text-wrap: balance;
  box-shadow: 0 3px 0 rgba(29,43,79,.18); opacity: 0; transition: opacity .3s; pointer-events: none;
}
.caption.on { opacity: 1; }

/* title screen: tap anywhere to start (which also lets the browser play sound) */
.title {
  position: fixed; inset: 0; z-index: 5; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vh;
  background: radial-gradient(circle at 50% 50%, rgba(255,255,255,.4), rgba(255,255,255,0) 65%);
  touch-action: none;
}
.title h1 { margin: 0; font-size: clamp(3.2rem, 14vw, 8rem); font-weight: 800; line-height: .95; text-align: center; padding-inline: 16px; }
.title h1 span { display: inline-block; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 rgba(29,43,79,.35); animation: bob 2.4s ease-in-out infinite; animation-delay: calc(var(--i) * -.22s); }
.play {
  width: clamp(120px, 28vmin, 190px); aspect-ratio: 1; border-radius: 50%; border: 5px solid var(--ink); background: var(--sun);
  box-shadow: 0 8px 0 rgba(29,43,79,.35); display: grid; place-items: center; padding: 0; animation: pulse 1.6s ease-in-out infinite;
}
.play svg { width: 52%; height: 52%; margin-left: 8%; }

/* the fish book */
.book { position: fixed; inset: 0; z-index: 10; background: rgba(8,28,58,.6); display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
.book-card {
  position: relative; background: #fffaf0; border: 4px solid var(--ink); border-radius: 28px; box-shadow: 0 8px 0 rgba(0,0,0,.25);
  width: 100%; max-width: 640px; max-height: 100%; overflow: auto; overscroll-behavior: contain; touch-action: pan-y;
  padding: 14px 16px 18px; box-sizing: border-box;
}
.book-card h2 { margin: 0 56px 0 0; font-size: 1.8rem; font-weight: 800; line-height: 1.1; }
.book-card .count { margin: 0 0 6px; color: #5b6782; font-weight: 600; }
.book-card h3 { margin: 12px 0 6px; font-size: 1.1rem; font-weight: 800; }
.book .close { position: absolute; top: 10px; right: 10px; background: #fff; border: 3px solid var(--ink); box-shadow: none; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.sticker { position: relative; aspect-ratio: 1; border: 3px solid var(--ink); border-radius: 20px; background: #fff; padding: 0; display: grid; place-items: center; box-shadow: 0 3px 0 rgba(29,43,79,.15); }
.sticker canvas { width: 82% !important; height: 82% !important; }
.sticker.no { background: #eef2f7; border-style: dashed; border-color: #a9b8cc; box-shadow: none; }
.sticker .n { position: absolute; right: 5px; bottom: 4px; background: var(--ink); color: #fff; border-radius: 999px; padding: 0 7px; font-size: .85rem; font-weight: 800; line-height: 1.4; }
.sticker.wiggle { animation: wiggle .5s ease 2; }

@keyframes pop { from { transform: scale(.3) } }
@keyframes hop { to { transform: translateY(-6px) } }
@keyframes bob { 50% { transform: translateY(-10%) rotate(-4deg) } }
@keyframes pulse { 50% { transform: scale(1.08) } }
@keyframes wiggle { 25% { transform: rotate(-8deg) } 75% { transform: rotate(8deg) } }

@media (max-width: 560px) {
  :root { --slot: 30px; }
  .bucket { gap: 4px; padding: 4px 8px 4px 4px; }
  .btns { gap: 6px; }
  .icon-btn { width: 40px; height: 40px; }
  .icon-btn svg { width: 22px; height: 22px; }
  .grid { gap: 6px; }
  .sticker { border-radius: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  .title h1 span, .play, .bucket li, .sticker { animation: none !important; }
}
</style>
</head>
<body>
<canvas id="sea" role="img" aria-label="The sea, with a little boat and fish swimming" tabindex="0"></canvas>

<header class="hud">
  <div class="bucket">
    <svg class="pail" viewBox="0 0 40 40" aria-hidden="true"><path d="M8 13 Q20 -2 32 13" fill="none" stroke="#1d2b4f" stroke-width="3" stroke-linecap="round"/><path d="M6 14 h28 l-4 22 h-20z" fill="#4fc3ff" stroke="#1d2b4f" stroke-width="3" stroke-linejoin="round"/><path d="M8 20 h24" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
    <ol class="slots" id="bucket" aria-label="Bucket"><li></li><li></li><li></li><li></li><li></li></ol>
  </div>
  <div class="btns">
    <button class="icon-btn" id="book-btn" aria-label="Fish book">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M3 5c3-1.3 6-1.3 9 1v14c-3-2.3-6-2.3-9-1z" fill="#ffd23f"/><path d="M21 5c-3-1.3-6-1.3-9 1v14c3-2.3 6-2.3 9-1z" fill="#ffd23f"/><path d="M14.5 11.5q2-2 4 0q-2 2-4 0z" fill="currentColor" stroke-width="1.6"/></svg>
    </button>
    <button class="icon-btn" id="mute" aria-label="Sound on" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path id="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
    </button>
    <button class="icon-btn" id="full" aria-label="Full screen" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
</header>

<p class="caption" id="caption" aria-live="polite"></p>

<div class="title" id="title-screen">
  <h1 id="title" aria-label="Funny Fish"></h1>
  <button class="play" id="play" aria-label="Play">
    <svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z" fill="#1d2b4f" stroke="#1d2b4f" stroke-width="2" stroke-linejoin="round"/></svg>
  </button>
</div>

<div class="book" id="book" role="dialog" aria-modal="true" aria-labelledby="book-title" hidden>
  <div class="book-card">
    <h2 id="book-title">Fish book</h2>
    <p class="count" id="book-count"></p>
    <button class="icon-btn close" id="book-close" aria-label="Close the fish book">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div id="book-pages"></div>
  </div>
</div>

<script type="module" src="src/game.js"></script>
<script type="module" src="src/analytics.js"></script>
</body>
</html>
